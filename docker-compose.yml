version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tokomakanan-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - APP_NAME=tokomakanan
      - APP_PORT=8080
      - APP_ENV=production
      - GIN_MODE=release
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=ikrom1214
      - DB_NAME=tokomakanan
      - JWT_SECRET=super-secret-jwt-key-with-minimum-32-chars
      - JWT_EXPIRY_HOURS=24
      - RATE_LIMIT_RPS=20
      - RATE_LIMIT_BURST=40
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173
      - BCRYPT_COST=12
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: tokomakanan-db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ikrom1214
      MYSQL_DATABASE: tokomakanan
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pikrom1214"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
